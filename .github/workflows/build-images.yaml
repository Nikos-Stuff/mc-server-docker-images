name: Build & Publish Images

on:
  push:
    branches:
      - main
    paths:
      - versions.json
      - Dockerfile
      - .github/workflows/build-images.yaml
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma separated engines to (re)build, e.g 'paper,purpur'. Empty = all"
        required: false
        default: ""
      versions:
        description: "Comma separated Minecraft versions to (re)build. If empty (re)build every version in versions.json"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    runs-on: ubuntu-latest

    outputs:
      images: ${{ steps.build-matrix.outputs.images }}

    steps:
      - uses: actions/checkout@v7

      - name: Build matrix from versions.json
        id: build-matrix
        run: |
            set -euo pipefail
            ALL='[]'
            for FILE in versions/*.json; do
              ENGINE="$(basename "$FILE" .json)"
              PART="$(jq -c --arg engine "$ENGINE" '[.versions[] | . + {engine: $engine}]' "$FILE")"
              ALL="$(jq -c -n --argjson a "$ALL" --argjson b "$PART" '$a + $b')"
            done

            ENGINE_FILTER='${{ github.event.inputs.engines }}'
            VERSION_FILTER='${{ github.event.inputs.versions }}'

            if [ -n "$ENGINE_FILTER" ]; then
              WANT_ENGINES="$(echo "$ENGINE_FILTER" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')"
              ALL="$(jq -c --argjson want "$WANT_ENGINES" '[.[] | select(.engine as $e | $want | index($e))]' <<< "$ALL")"
            fi

            if [ -n "$VERSION_FILTER" ]; then
              WANT_VERSIONS="$(echo "$VERSION_FILTER" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')"
              ALL="$(jq -c --argjson want "$WANT_VERSIONS" '[.[] | select(.minecraft as $m | $want | index($m))]' <<< "$ALL")"
            fi

            echo "images=${ALL}" >> "$GITHUB_OUTPUT"


  build:
    needs: matrix
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          build-args: |
              MC_VERSION=${{ matrix.image.minecraft }}
              JAVA_PACKAGE=${{ matrix.image.java_package }}
          tags: |
              ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image.engine }}:${{ matrix.image.tag }}
