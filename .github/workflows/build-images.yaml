name: Build & Publish Images

on:
  push:
    branches:
      - main
    paths:
      - versions/**
      - docker/**
      - scripts/**
      - python/**
      - .github/workflows/build-images.yaml
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma separated engines to (re)build, e.g 'paper,purpur'. Empty = all"
        required: false
        default: ""
      versions:
        description: "Comma separated Minecraft versions to (re)build. If empty (re)build every version in versions.json"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * *"

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      images: ${{ steps.changed-matrix.outputs.images || steps.versions-with-builds.outputs.images }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build matrix from versions.json
        id: build-matrix
        env:
          ENGINES: ${{ github.event.inputs.engines }}
          VERSIONS: ${{ github.event.inputs.versions }}
        run: python3 python/build_matrix.py

      - name: Resolve latest jar builds
        id: versions-with-builds
        env:
          IMAGES: ${{ steps.build-matrix.outputs.images }}
        run: python3 python/resolve_builds.py

      - name: Keep only images with a new jar build
        id: changed-matrix
        if: github.event_name == 'schedule'
        env:
          IMAGES: ${{ steps.versions-with-builds.outputs.images }}
          STATE: ${{ vars.JAR_BUILD_STATE }}
        run: python3 python/changed.py


  build:
    needs: matrix
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image.engine }}/Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          build-args: |
              MC_VERSION=${{ matrix.image.minecraft }}
              JAVA_PACKAGE=${{ matrix.image.java_package }}
          tags: |
              ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image.engine }}:${{ matrix.image.tag }}

  state:
    needs: [matrix, build]
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Record published jar builds
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          IMAGES: ${{ needs.matrix.outputs.images }}
          STATE: ${{ vars.JAR_BUILD_STATE }}
        run: python3 python/record_state.py
