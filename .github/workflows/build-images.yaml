name: Build & Publish Images

on:
  push:
    branches:
      - main
    paths:
      - versions.json
      - docker/**
      - scripts/**
      - .github/workflows/build-images.yaml
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma separated engines to (re)build, e.g 'paper,purpur'. Empty = all"
        required: false
        default: ""
      versions:
        description: "Comma separated Minecraft versions to (re)build. If empty (re)build every version in versions.json"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * *"

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      images: ${{ steps.changed-matrix.outputs.images || steps.versions-with-builds.outputs.images }}

    steps:
      - uses: actions/checkout@v7

      - name: Build matrix from versions.json
        id: build-matrix
        run: |
            set -euo pipefail
            ALL='[]'
            for FILE in versions/*.json; do
              ENGINE="$(basename "$FILE" .json)"
              PART="$(jq -c --arg engine "$ENGINE" '[.versions[] | . + {engine: $engine}]' "$FILE")"
              ALL="$(jq -c -n --argjson a "$ALL" --argjson b "$PART" '$a + $b')"
            done

            ENGINE_FILTER='${{ github.event.inputs.engines }}'
            VERSION_FILTER='${{ github.event.inputs.versions }}'

            if [ -n "$ENGINE_FILTER" ]; then
              WANT_ENGINES="$(echo "$ENGINE_FILTER" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')"
              ALL="$(jq -c --argjson want "$WANT_ENGINES" '[.[] | select(.engine as $e | $want | index($e))]' <<< "$ALL")"
            fi

            if [ -n "$VERSION_FILTER" ]; then
              WANT_VERSIONS="$(echo "$VERSION_FILTER" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')"
              ALL="$(jq -c --argjson want "$WANT_VERSIONS" '[.[] | select(.minecraft as $m | $want | index($m))]' <<< "$ALL")"
            fi

            echo "images=${ALL}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest jar builds
        id: versions-with-builds
        env:
          IMAGES: ${{ steps.build-matrix.outputs.images }}
        run: |
            set -uo pipefail
            RESULT='[]'
            while IFS= read -r IMAGE; do
              ENGINE="$(jq -r '.engine' <<< "${IMAGE}")"
              MC_VERSION="$(jq -r '.minecraft' <<< "${IMAGE}")"
              # Quick and dirty
              case "${ENGINE}" in
                paper) TYPE=PAPER ;;
                purpur) TYPE=PURPUR ;;
                fabric) TYPE=FABRIC ;;
                leafmc) TYPE=LEAF ;;
                *)
                  echo "No mcjars type mapping for engine ${ENGINE}; skipping" >&2
                  continue
                  ;;
              esac
              URL="https://mcjars.app/api/v3/builds/types/${TYPE}/versions/${MC_VERSION}/latest"
              UUID="$(curl -fsSL "${URL}" 2>/dev/null | jq -r '.build.uuid // empty')" || UUID=""
              if [ -z "${UUID}" ]; then
                echo "Couldn't resolve latest build for ${ENGINE} ${MC_VERSION}; skipping" >&2
                continue
              fi
              RESULT="$(jq -c --argjson image "${IMAGE}" --arg uuid "${UUID}" '. + [($image + {build_uuid: $uuid})]' <<< "${RESULT}")"
            done < <(jq -c '.[]' <<< "${IMAGES}")
            {
              echo "images<<EOF"
              echo "${RESULT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

      - name: Keep only images with a new jar build
        id: changed-matrix
        if: github.event_name == 'schedule'
        env:
          IMAGES: ${{ steps.versions-with-builds.outputs.images }}
          STATE: ${{ vars.JAR_BUILD_STATE }}
        run: |
            set -uo pipefail
            CURRENT_STATE='{}'
            if [ -n "${STATE:-}" ]; then
              CURRENT_STATE="$(jq -c '.' <<< "${STATE}")"
            fi
            RESULT='[]'
            while IFS= read -r IMAGE; do
              ENGINE="$(jq -r '.engine' <<< "${IMAGE}")"
              TAG="$(jq -r '.tag' <<< "${IMAGE}")"
              UUID="$(jq -r '.build_uuid' <<< "${IMAGE}")"
              CURRENT="$(jq -r --arg key "${ENGINE}:${TAG}" '.[$key] // empty' <<< "${CURRENT_STATE}")"
              if [ "${CURRENT}" != "${UUID}" ]; then
                RESULT="$(jq -c --argjson image "${IMAGE}" '. + [$image]' <<< "${RESULT}")"
              fi
            done < <(jq -c '.[]' <<< "${IMAGES}")
            {
              echo "images<<EOF"
              echo "${RESULT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"


  build:
    needs: matrix
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image.engine }}/Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          build-args: |
              MC_VERSION=${{ matrix.image.minecraft }}
              JAVA_PACKAGE=${{ matrix.image.java_package }}
          tags: |
              ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image.engine }}:${{ matrix.image.tag }}

  state:
    needs: [matrix, build]
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Record published jar builds
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          IMAGES: ${{ needs.matrix.outputs.images }}
          STATE: ${{ vars.JAR_BUILD_STATE }}
        run: |
            set -euo pipefail
            CURRENT_STATE='{}'
            if [ -n "${STATE:-}" ]; then
              CURRENT_STATE="$(jq -c '.' <<< "${STATE}")"
            fi
            while IFS= read -r IMAGE; do
              ENGINE="$(jq -r '.engine' <<< "${IMAGE}")"
              TAG="$(jq -r '.tag' <<< "${IMAGE}")"
              UUID="$(jq -r '.build_uuid' <<< "${IMAGE}")"
              CURRENT_STATE="$(jq -c --arg key "${ENGINE}:${TAG}" --arg uuid "${UUID}" '. + {($key): $uuid}' <<< "${CURRENT_STATE}")"
            done < <(jq -c '.[]' <<< "${IMAGES}")
            gh variable set JAR_BUILD_STATE --repo "${GITHUB_REPOSITORY}" --body "$(jq -c . <<< "${CURRENT_STATE}")"
