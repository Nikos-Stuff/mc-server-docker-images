name: Build & Publish Images

on:
  push:
    branches:
      - main
    paths:
      - versions.json
      - Dockerfile
      - .github/workflows/build-images.yaml
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma separated Minecraft versions to (re)build. If empty (re)build every version in versions.json"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    runs-on: ubuntu-latest

    outputs:
      images: ${{ steps.build-matrix.outputs.images }}

    steps:
      - uses: actions/checkout@v7

      - name: Build matrix from versions.json
        id: build-matrix
        run: |
          set -euo pipefail
          FILTER='${{ github.event.inputs.versions }}'
          if [ -n "$FILTER" ]; then
            WANT=$(echo "$FILTER" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')
            IMAGES=$(jq -c --argjson want "$WANT" '[.versions[] | select(.minecraft as $m | $want | index($m))]' versions.json)
          else
            IMAGES=$(jq -c '.versions' versions.json)
          fi

          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          build-args: |
              MC_VERSION=${{ matrix.image.minecraft }}
              JAVA_PACKAGE=${{ matrix.image.java_package }}
          tags: |
              ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ matrix.image.tag }}
